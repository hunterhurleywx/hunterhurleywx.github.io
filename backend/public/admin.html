<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Buddy Network - Admin</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #1a1a1a;
      color: #fff;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 2px solid #333;
    }
    
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    
    .stat-card {
      background: #333;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
    }
    
    .stat-number {
      font-size: 2em;
      font-weight: bold;
      color: #4CAF50;
    }
    
    .filters {
      background: #333;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
    }
    
    .reports-table {
      background: #333;
      border-radius: 8px;
      overflow: hidden;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
    }
    
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #555;
    }
    
    th {
      background: #444;
      font-weight: bold;
    }
    
    .report-type {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.9em;
      font-weight: bold;
    }
    
    .type-tornado { background: #f44336; }
    .type-hail { background: #4CAF50; }
    .type-wind { background: #2196F3; }
    .type-flood { background: #03A9F4; }
    .type-damage { background: #9C27B0; }
    .type-other { background: #FF9800; }
    
    .verified {
      color: #4CAF50;
      font-weight: bold;
    }
    
    .unverified {
      color: #FFC107;
    }
    
    button {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9em;
    }
    
    .btn-verify {
      background: #4CAF50;
      color: white;
    }
    
    .btn-delete {
      background: #f44336;
      color: white;
    }
    
    .btn-logout {
      background: #555;
      color: white;
    }
    
    select, input {
      padding: 8px;
      background: #555;
      color: white;
      border: 1px solid #666;
      border-radius: 4px;
    }
    
    .age {
      font-size: 0.9em;
      color: #bbb;
    }
    
    .coordinates {
      font-family: monospace;
      font-size: 0.9em;
    }
    
    .placefile-info {
      background: #2a2a2a;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    
    .placefile-url {
      font-family: monospace;
      background: #444;
      padding: 10px;
      border-radius: 4px;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Report Buddy Network - Admin Panel</h1>
      <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
    
    <div class="placefile-info">
      <h3>GR2Analyst Placefile URL:</h3>
      <div class="placefile-url" id="placefileUrl">Loading...</div>
      <p>Add this URL to GR2Analyst under Placefiles menu to view reports on radar.</p>
    </div>
    
    <div class="stats">
      <div class="stat-card">
        <div class="stat-number" id="totalReports">0</div>
        <div>Total Reports</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="recentReports">0</div>
        <div>Last 6 Hours</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="verifiedReports">0</div>
        <div>Verified</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="activeSpotters">0</div>
        <div>Active Spotters</div>
      </div>
    </div>
    
    <div class="filters">
      <label>Time Filter:</label>
      <select id="timeFilter" onchange="loadReports()">
        <option value="1">Last Hour</option>
        <option value="6" selected>Last 6 Hours</option>
        <option value="24">Last 24 Hours</option>
        <option value="168">Last Week</option>
      </select>
      
      <label>Type Filter:</label>
      <select id="typeFilter" onchange="filterReports()">
        <option value="">All Types</option>
        <option value="Tornado">Tornado</option>
        <option value="Hail">Hail</option>
        <option value="Wind">Wind</option>
        <option value="Flood">Flood</option>
        <option value="Damage">Damage</option>
      </select>
      
      <button onclick="loadReports()">Refresh</button>
    </div>
    
    <div class="reports-table">
      <table>
        <thead>
          <tr>
            <th>Time</th>
            <th>Type</th>
            <th>Location</th>
            <th>Coordinates</th>
            <th>Details</th>
            <th>Spotter</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="reportsTable">
          <tr>
            <td colspan="8" style="text-align: center; padding: 40px;">Loading reports...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    let allReports = [];
    
    // Set placefile URL
    document.getElementById('placefileUrl').textContent = 
      `${window.location.origin}/placefile.txt`;
    
    async function loadReports() {
      try {
        const hours = document.getElementById('timeFilter').value;
        const response = await fetch(`/api/reports?hours=${hours}`);
        
        if (!response.ok) {
          if (response.status === 401) {
            window.location.href = '/login.html';
            return;
          }
          throw new Error('Failed to load reports');
        }
        
        allReports = await response.json();
        updateStats();
        filterReports();
      } catch (error) {
        console.error('Error loading reports:', error);
        alert('Error loading reports');
      }
    }
    
    function filterReports() {
      const typeFilter = document.getElementById('typeFilter').value;
      const filtered = typeFilter ? 
        allReports.filter(r => r.type === typeFilter) : 
        allReports;
      
      displayReports(filtered);
    }
    
    function displayReports(reports) {
      const tbody = document.getElementById('reportsTable');
      
      if (reports.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 40px;">No reports found</td></tr>';
        return;
      }
      
      tbody.innerHTML = reports.map(report => {
        const age = Math.round((Date.now() - new Date(report.submitted_at)) / (1000 * 60));
        const typeClass = `type-${report.type.toLowerCase().replace(' ', '-')}`;
        
        return `
          <tr>
            <td>
              <div>${new Date(report.submitted_at).toLocaleString()}</div>
              <div class="age">${age}min ago</div>
            </td>
            <td><span class="report-type ${typeClass}">${report.type}</span></td>
            <td>${report.location}</td>
            <td class="coordinates">${report.lat.toFixed(4)}, ${report.lon.toFixed(4)}</td>
            <td>${report.details || 'No details'}</td>
            <td>${report.spotter_id}</td>
            <td class="${report.verified ? 'verified' : 'unverified'}">
              ${report.verified ? '✓ Verified' : '⚠ Unverified'}
            </td>
            <td>
              ${!report.verified ? `<button class="btn-verify" onclick="verifyReport(${report.id})">Verify</button>` : ''}
              <button class="btn-delete" onclick="deleteReport(${report.id})">Delete</button>
            </td>
          </tr>
        `;
      }).join('');
    }
    
    function updateStats() {
      const now = Date.now();
      const sixHoursAgo = now - (6 * 60 * 60 * 1000);
      const recent = allReports.filter(r => new Date(r.submitted_at) > sixHoursAgo);
      const verified = allReports.filter(r => r.verified);
      const spotters = new Set(allReports.map(r => r.spotter_id));
      
      document.getElementById('totalReports').textContent = allReports.length;
      document.getElementById('recentReports').textContent = recent.length;
      document.getElementById('verifiedReports').textContent = verified.length;
      document.getElementById('activeSpotters').textContent = spotters.size;
    }
    
    async function verifyReport(id) {
      try {
        const response = await fetch(`/api/reports/${id}/verify`, {
          method: 'PATCH'
        });
        
        if (response.ok) {
          loadReports();
        } else {
          alert('Failed to verify report');
        }
      } catch (error) {
        console.error('Error verifying report:', error);
        alert('Error verifying report');
      }
    }
    
    async function deleteReport(id) {
      if (!confirm('Are you sure you want to delete this report?')) return;
      
      try {
        const response = await fetch(`/api/reports/${id}`, {
          method: 'DELETE'
        });
        
        if (response.ok) {
          loadReports();
        } else {
          alert('Failed to delete report');
        }
      } catch (error) {
        console.error('Error deleting report:', error);
        alert('Error deleting report');
      }
    }
    
    async function logout() {
      try {
        await fetch('/api/logout', { method: 'POST' });
        window.location.href = '/login.html';
      } catch (error) {
        console.error('Error logging out:', error);
      }
    }
    
    // Load reports on page load
    loadReports();
    
    // Auto-refresh every 30 seconds
    setInterval(loadReports, 30000);
  </script>
</body>
</html>
